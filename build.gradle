plugins {
    id 'java'
    id 'application'
}

group = 'com.si'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.si.inventory.App'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.si.inventory.App'
    }
}
