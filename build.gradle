plugins {
    id 'java'
    id 'application'
    id 'edu.sc.seis.launch4j' version '4.0.0'
}

group = 'com.si'
version = '1.0.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    runtimeOnly 'com.mysql:mysql-connector-j:8.4.0'
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.si.inventory.App'
}

launch4j {
    mainClassName = 'com.si.inventory.App'
    outfile = 'SI-Inventory.exe'
    icon = "${projectDir}/src/main/resources/icons/si-inventory.ico"
    jreMinVersion = '1.8.0'
    headerType = 'gui'
    productName = 'SI-Inventory'
    fileDescription = 'SI-Inventory'
}

jar {
    manifest {
        attributes 'Main-Class': 'com.si.inventory.App'
    }
}
